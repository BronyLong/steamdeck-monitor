<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Вход</title>
        <link rel="stylesheet" href="../styles/reset.css" />
        <link rel="stylesheet" href="../styles/variables.css" />
        <link rel="stylesheet" href="../styles/global.css" />
        <link rel="stylesheet" href="../styles/login.css" />
    </head>
    <body class="login-page">
        <main class="login">
            <div class="login__content">
                <p class="login__brand">Steam Deck Monitor</p>
                <h1 class="login__title">Вход</h1>
                <!-- Учебная форма: обработка авторизации пока не подключена. -->
                <form class="login__form" method="post">
                    <label class="field__label" for="username">Имя пользователя</label>
                    <input
                        class="field__control"
                        type="text"
                        placeholder="Введите имя пользователя"
                        id="username"
                        name="username"
                        required
                        autocomplete="username"
                    />

                    <label class="field__label" for="userpassword">Пароль</label>
                    <input
                        class="field__control"
                        type="password"
                        placeholder="Пароль"
                        id="userpassword"
                        name="password"
                        required
                        autocomplete="current-password"
                    />

                    <button class="button login__submit" type="submit">Войти</button>
                </form>
            </div>
        </main>
    </body>
</html>
